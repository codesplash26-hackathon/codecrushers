services:
  mongodb:
    image: mongo:7.0
    container_name: bestroute-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bestroute-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/bestroute
      - JWT_SECRET=BestRoute_Secure_JWT_2026_x7K9mP2q
    depends_on:
      - mongodb

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: bestroute-admin
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  mobile-app:
    build:
      context: ./mobile-app
      dockerfile: Dockerfile
    container_name: bestroute-mobile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo_data:
